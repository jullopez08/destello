<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cocina Destello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: panel de cocina. Barra lateral amarilla + contenido sobre crema; tarjetas pastel como etiquetas de caja de galletas. */
:root{color-scheme:light;
  --bg:#fff7e6; --surface:#ffffff; --surface-2:#fff0c7; --ink:#3d2417; --ink-2:#7d5d4a; --line:#f1e1bf;
  --yellow:#ffd23f; --yellow-deep:#f5b700; --on-yellow:#3d2417;
  --banana:#fdf1b0; --strawberry:#ffc6d1; --lilac:#e6d5f3; --peach:#ffd9c2; --sky:#d3e5ff;
  --cherry:#cf3f5a; --orange:#c96a12; --blue:#2f5f9e;
  --shadow:0 10px 30px rgba(120,80,20,.10);
  --display:'Bagel Fat One','Cooper Black',Georgia,serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d140f; --surface:#2a1e16; --surface-2:#3a2a19; --ink:#fbecd6; --ink-2:#cfb49e; --line:#4a3627;
  --banana:#4a3f1c; --strawberry:#57293a; --lilac:#3f3152; --peach:#563624; --sky:#233a58;
  --cherry:#ff8aa0; --orange:#ffb46b; --blue:#9cc3ff; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d140f; --surface:#2a1e16; --surface-2:#3a2a19; --ink:#fbecd6; --ink-2:#cfb49e; --line:#4a3627;
  --banana:#4a3f1c; --strawberry:#57293a; --lilac:#3f3152; --peach:#563624; --sky:#233a58;
  --cherry:#ff8aa0; --orange:#ffb46b; --blue:#9cc3ff; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(28px,4vw,40px)}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px;border-radius:6px}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--yellow);color:var(--on-yellow);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.brand small{display:block;font-size:12px;font-weight:600;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;color:var(--on-yellow);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.35)}
.nav a.on{background:#fffaf0;box-shadow:0 4px 0 rgba(61,36,23,.12)}
.nav svg{width:20px;height:20px;flex:none}
.side .foot{margin-top:auto;font-size:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.4)}
.side .foot button{margin-top:8px}
.main{min-width:0;padding-inline:clamp(16px,3vw,36px);padding-block:22px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}
.top .who{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--strawberry);color:var(--ink);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--yellow-deep);display:inline-block}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head p{margin-top:6px;max-width:62ch}

/* ---------- Building blocks ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow);box-shadow:0 4px 0 var(--yellow-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--cherry);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:18px;height:18px}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:10px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover{transform:none}}

.card{background:var(--surface);border-radius:22px;padding:20px;border:1px solid var(--line)}
.card h2,.card h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
@media (max-width:560px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:22px}.top .pill.num{display:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.c-banana{background:var(--banana);border-color:transparent}
.c-strawberry{background:var(--strawberry);border-color:transparent}
.c-lilac{background:var(--lilac);border-color:transparent}
.c-peach{background:var(--peach);border-color:transparent}
.c-sky{background:var(--sky);border-color:transparent}
.c-yellow{background:var(--yellow);color:var(--on-yellow);border-color:transparent}

.kpi{display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;font-weight:600}
.kpi .s{font-size:12px;opacity:.8}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink)}
.chip.ok{background:var(--sky);color:var(--blue)}
.chip.warn{background:var(--peach);color:var(--orange)}
.chip.bad{background:var(--strawberry);color:var(--cherry)}
.chip.lilac{background:var(--lilac)}
.chip.banana{background:var(--banana)}
.chip.dark{background:var(--ink);color:var(--bg)}

.tbl{overflow-x:auto;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:left;padding:12px 14px;background:var(--surface-2);font-weight:700}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--yellow-deep)}
.bar.bad>span{background:var(--cherry)}
.bar.warn>span{background:var(--orange)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px;max-width:320px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px}

.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px dashed var(--line)}
.list .it:first-child{border-top:0;padding-top:0}
.list .it>div{min-width:0}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:2px dashed var(--line);border-radius:18px}

/* cookie illustration */
.cookie{width:var(--s,54px);height:var(--s,54px);border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 30% 30%,#5a3220 0 5%,transparent 6%),radial-gradient(circle at 64% 40%,#5a3220 0 6%,transparent 7%),radial-gradient(circle at 42% 68%,#5a3220 0 5%,transparent 6%),radial-gradient(circle at 72% 72%,#5a3220 0 4%,transparent 5%),radial-gradient(circle at 50% 50%,#e9b86e 0 58%,#d79a4a 70%);box-shadow:inset -4px -6px 0 rgba(0,0,0,.08)}
.cookie.choco{background:radial-gradient(circle at 30% 34%,#f5e6d0 0 5%,transparent 6%),radial-gradient(circle at 62% 42%,#2c160c 0 6%,transparent 7%),radial-gradient(circle at 44% 70%,#f5e6d0 0 4%,transparent 5%),radial-gradient(circle at 50% 50%,#6b3a22 0 60%,#4e2817 72%)}
.cookie.roll{background:repeating-radial-gradient(circle at 50% 50%,#f4d6a8 0 6%,#c98642 6% 10%),#f4d6a8}
.cookie.bread{border-radius:46% 46% 40% 40%;background:radial-gradient(circle at 50% 30%,#f3c27d,#c9853b 75%)}
.cookie.pump{background:radial-gradient(circle at 50% 50%,#ff9f43 0 60%,#e77f1f 72%)}
.cookie.star{background:radial-gradient(circle at 50% 50%,#fff2b3 0 55%,#f2c94c 72%)}

/* ---------- Modal ---------- */
.veil{position:fixed;inset:0;background:rgba(40,22,10,.45);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--bg);border-radius:26px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 24px 6px;position:sticky;top:0;background:var(--bg);z-index:1}
.modal .body{padding:10px 24px 8px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 24px 22px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;min-width:0}
label.f span.h{font-weight:400;color:var(--ink-2);font-size:12px}
.f input,.f select,.f textarea,.line input,.line select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.line input:focus,.line select:focus{outline:none;border-color:var(--yellow-deep);box-shadow:0 0 0 3px rgba(245,183,0,.25)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.seg input:checked+span{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow-deep)}
.seg input:focus-visible+span{outline:3px solid var(--yellow-deep)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;gap:8px;align-items:center;grid-template-columns:minmax(0,1fr) 110px 36px}
.line.k-purchase{grid-template-columns:minmax(0,1fr) 90px 80px 120px 36px}
.line .u{font-size:12px;color:var(--ink-2)}
@media (max-width:560px){.line.k-purchase{grid-template-columns:1fr 1fr 36px}.line.k-purchase>:first-child{grid-column:1/-1}}
.callout{border-radius:16px;padding:12px 14px;font-size:14px}
.err{color:var(--cherry);font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{background:var(--yellow);color:var(--on-yellow);padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.login .art h1{font-size:clamp(46px,8vw,96px);line-height:.92}
.login .art p{font-size:18px;max-width:34ch;margin-top:14px}
.plate{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.plate .cookie{--s:84px}
.login .form{display:grid;place-items:center;padding:32px 16px}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}

/* ---------- Charts ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--body)}
.chart .lbl{fill:var(--ink);font-weight:700}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:4px 10px;align-items:center}
.hbar .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{grid-column:1/-1;height:12px}
.hbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--yellow-deep)}
.check.done span{text-decoration:line-through;color:var(--ink-2)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .pill{white-space:normal}
  .top .who>div:first-child{display:none}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding:12px 16px;gap:10px;flex-direction:column;overflow:visible}
  .brand b{font-size:22px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .nav a{padding:7px 12px}
  .side .foot{display:none}
  .login{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="root"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================= Datos de ejemplo ================= */

const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (s,n) => { const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const uid = p => p + Math.random().toString(36).slice(2,8);

function seed(){

      {id:'p3',name:'Chocolates Andinos',contact:'Laura Méndez',phone:'301 998 1122',email:'laura@chocandinos.co',address:'Av. 68 # 13-50',notes:'Chips de chocolate 54 %. Descuento por 5 kg.',color:'peach'},
      {id:'p4',name:'Empaques Dulce Caja',contact:'Sofía Pardo',phone:'320 777 6655',email:'ventas@dulcecaja.co',address:'Calle 13 # 68-90',notes:'Cajas kraft con ventana. Stickers personalizados en 5 días.',color:'strawberry'},

      {id:'cacao',name:'Cacao en polvo',kind:'mass',cat:'ing',stock:900,min:500,cost:30,sup:'p3'},
      {id:'canela',name:'Canela molida',kind:'mass',cat:'ing',stock:240,min:300,cost:60,sup:'p5'},
      {id:'vainilla',name:'Esencia de vainilla',kind:'vol',cat:'ing',stock:400,min:100,cost:25,sup:'p5'},
      {id:'levadura',name:'Levadura seca',kind:'mass',cat:'ing',stock:500,min:200,cost:25,sup:'p1'},
      {id:'caja9',name:'Caja kraft x9',kind:'unit',cat:'emp',stock:40,min:20,cost:900,sup:'p4'},
      {id:'caja3',name:'Caja rollos x3',kind:'unit',cat:'emp',stock:12,min:15,cost:750,sup:'p4'},
      {id:'caja6',name:'Caja rollos x6',kind:'unit',cat:'emp',stock:30,min:15,cost:800,sup:'p4'},

      {id:'capacillo',name:'Capacillo',kind:'unit',cat:'emp',stock:500,min:200,cost:12,sup:'p4'}
    ],
    purchases:[
      {id:'c1',date:addDays(TODAY,-6),sup:'p1',lines:[{supply:'harina',qty:25000,total:80000},{supply:'azucar',qty:10000,total:38000}]},
      {id:'c2',date:addDays(TODAY,-4),sup:'p3',lines:[{supply:'chocolate',qty:3000,total:114000}]},
      {id:'c3',date:addDays(TODAY,-2),sup:'p2',lines:[{supply:'mantequilla',qty:5000,total:140000},{supply:'huevos',qty:60,total:36000}]}
    ],
    recipes:[
      {id:'r-chips',name:'Masa de galleta con chips',yield:2400,color:'banana',items:[{supply:'harina',qty:1000},{supply:'mantequilla',qty:500},{supply:'morena',qty:400},{supply:'chocolate',qty:400},{supply:'huevos',qty:4},{supply:'vainilla',qty:10}]},

const fmtN = (n,d=0) => Number(n||0).toLocaleString('es-CO',{maximumFractionDigits:d});
const money = n => '$ ' + fmtN(Math.round(n));
const byId = (arr,id) => arr.find(x => x.id === id);
const sup = id => byId(S.supplies,id);
const unitOf = k => k==='mass'?'g':k==='vol'?'ml':'und';
function qty(n,kind){
  n = Number(n)||0;
  if(kind==='mass') return Math.abs(n)>=1000 ? fmtN(n/1000,2)+' kg' : fmtN(n)+' g';
  if(kind==='vol') return Math.abs(n)>=1000 ? fmtN(n/1000,2)+' l' : fmtN(n)+' ml';
  return fmtN(n,1)+' und';
}
const grams = n => qty(n,'mass');
const costLabel = s => s.kind==='unit' ? money(s.cost)+' / und' : money(s.cost*1000)+(s.kind==='mass'?' / kg':' / l');
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function dateLabel(s){ if(s===TODAY) return 'Hoy'; if(s===addDays(TODAY,1)) return 'Mañana'; if(s===addDays(TODAY,-1)) return 'Ayer'; const d=new Date(s+'T12:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()]; }
function longDate(s){ const d=new Date(s+'T12:00:00'); return DAYS[d.getDay()]+' '+d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]; }
function initials(n){ return String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

/* ================= Reglas de cocina ================= */
function recipeCostPerG(r){ return r.items.reduce((a,i)=>a+i.qty*(sup(i.supply)?.cost||0),0)/r.yield; }
function productCost(p){
  const r = byId(S.recipes,p.recipe);
  const dough = r ? p.grams*recipeCostPerG(r) : 0;
  return dough + (p.extras||[]).reduce((a,e)=>a+e.qty*(sup(e.supply)?.cost||0),0);
}
function presCost(pr){
  return pr.items.reduce((a,i)=>a+i.units*productCost(byId(S.products,i.product)||{extras:[]}),0)
       + pr.pack.reduce((a,k)=>a+k.qty*(sup(k.supply)?.cost||0),0);
}
function presMargin(pr){ const c=presCost(pr); return pr.price ? (pr.price-c)/pr.price : 0; }
function presHealth(pr){
  const c=presCost(pr), m=presMargin(pr), target=S.settings.margin/100;
  if(pr.price < c) return {k:'bad',t:'Pierde dinero',sug:Math.ceil(c/(1-target)/500)*500};
  if(m < target) return {k:'warn',t:'Margen bajo',sug:Math.ceil(c/(1-target)/500)*500};
  return {k:'ok',t:'Margen sano',sug:null};
}
function orderSubtotal(o){ return o.lines.reduce((a,l)=>a+l.qty*(byId(S.presentations,l.pres)?.price||0),0); }
function orderTotal(o){ return orderSubtotal(o)+(Number(o.fee)||0); }
function lotGrams(recipeId){ return S.lots.filter(l=>l.recipe===recipeId).reduce((a,l)=>a+l.left,0); }

/* Requisitos de una lista de líneas {pres,qty} */
function requirements(lines){
  const dough={}, direct={}, units={}, boxes={};
  for(const l of lines){
    const pr=byId(S.presentations,l.pres); if(!pr) continue;
    boxes[pr.id]=(boxes[pr.id]||0)+l.qty;
    for(const k of pr.pack) direct[k.supply]=(direct[k.supply]||0)+k.qty*l.qty;
    for(const it of pr.items){
      const p=byId(S.products,it.product); if(!p) continue;
      const u=it.units*l.qty; units[p.id]=(units[p.id]||0)+u;
      dough[p.recipe]=(dough[p.recipe]||0)+u*p.grams;
      for(const e of p.extras||[]) direct[e.supply]=(direct[e.supply]||0)+e.qty*u;
    }
  }
  return {dough,direct,units,boxes};
}
/* Plan: usa primero masa de lotes (solo productos con lote), lo demás se hace con insumos */
function plan(lines){
  const req=requirements(lines), need={...req.direct}, doughRows=[];
  for(const [rid,g] of Object.entries(req.dough)){
    const r=byId(S.recipes,rid); if(!r) continue;
    const usesLots = S.products.some(p=>p.recipe===rid && p.mode==='lote');
    const fromLots = usesLots ? Math.min(lotGrams(rid),g) : 0;
    const toMake = g-fromLots;
    doughRows.push({recipe:r,need:g,fromLots,toMake,batches:toMake/r.yield});
    for(const i of r.items) need[i.supply]=(need[i.supply]||0)+i.qty*toMake/r.yield;
  }
  const supplies=Object.entries(need).map(([id,q])=>{ const s=sup(id); return {s,need:q,short:Math.max(0,q-(s?.stock||0))}; }).filter(x=>x.s);
  return {...req,doughRows,supplies,shortages:supplies.filter(x=>x.short>0.0001)};
}
function prodDateFor(now=new Date()){
  const [h,m]=S.settings.cutoff.split(':').map(Number);
  let d=iso(now); if(now.getHours()*60+now.getMinutes() >= h*60+m) d=addDays(d,1);
  for(let i=0;i<7 && S.settings.closed.includes(new Date(d+'T12:00:00').getDay());i++) d=addDays(d,1);
  return d;
}

      ${pend.length?`<div class="list">${pend.map(o=>`<div class="it"><div><b>${esc(o.customer)}</b><div class="small muted">${o.lines.map(l=>l.qty+' × '+esc(byId(S.presentations,l.pres)?.name||'')).join(', ')}</div></div><b class="num">${money(orderTotal(o))}</b></div>`).join('')}</div>`:`<div class="empty">Todo producido.</div>`}
    </div>
    <div class="card"><h2>Insumos bajos</h2>
      ${low.length?`<div class="list">${low.map(s=>`<div class="it"><div><b>${esc(s.name)}</b><div class="small muted">Quedan ${qty(s.stock,s.kind)} · mínimo ${qty(s.min,s.kind)}</div></div><a class="btn soft sm" href="#compras">Comprar</a></div>`).join('')}</div>`:`<div class="empty">Ningún insumo bajo.</div>`}
    </div>
    <div class="stack">
      ${ed?`<div class="card c-${ed.color}"><div class="row"><span class="cookie ${ed.look}" style="--s:48px"></span><div><div class="eyebrow">Edición activa</div><h2 style="margin:4px 0 0">${esc(ed.name)}</h2></div></div>
        <p style="margin-top:12px">${editionSold(ed)} de ${ed.cap||'∞'} vendidas · cierra el ${dateLabel(ed.end)}</p>
        ${ed.cap?`<div class="bar" style="margin-top:8px;background:rgba(255,255,255,.5)"><span style="width:${Math.min(100,editionSold(ed)/ed.cap*100)}%"></span></div>`:''}</div>`:''}
      <div class="card"><h2>En camino</h2>${onWay.length?`<div class="list">${onWay.map(o=>`<div class="it"><div><b>${esc(o.customer)}</b><div class="small muted">Con ${esc(byId(S.settings.couriers,o.courier)?.name||'repartidor')} · ${o.pay==='efectivo'?'cobra '+money(orderTotal(o)):'ya pagó'}</div></div><button class="btn soft sm" data-act="order-deliver" data-id="${o.id}">Entregado</button></div>`).join('')}</div>`:`<div class="empty">Nada en camino.</div>`}</div>
    </div>
  </div>`;
},

pedidos(){
  const tab=UI.tab.pedidos||'pendiente';
  const tabs=[['pendiente','Por producir'],['listo','Listos para enviar'],['camino','En camino'],['entregado','Entregados'],['todos','Todos']];
  const f=o=> tab==='todos'?true : tab==='pendiente'? o.status==='pendiente'&&!o.produced : tab==='listo'? o.status==='pendiente'&&o.produced : o.status===tab;
  const rows=S.orders.filter(f).sort((a,b)=>b.n-a.n);
  const count=k=>S.orders.filter(o=>k==='todos'||(k==='pendiente'?o.status==='pendiente'&&!o.produced:k==='listo'?o.status==='pendiente'&&o.produced:o.status===k)).length;
  return `<div class="head"><div><h1>Pedidos</h1><p class="muted">Los pedidos llegan por WhatsApp. Aquí puedes registrar uno a mano y seguir su entrega.</p></div><button class="btn yellow" data-act="order-new">${icon('plus')}Nuevo pedido</button></div>
  <div class="tabs">${tabs.map(([k,t])=>`<button data-act="tab" data-tab="pedidos" data-v="${k}" class="${tab===k?'on':''}">${t} · ${count(k)}</button>`).join('')}</div>
  ${rows.length?`<div class="tbl"><table><thead><tr><th>#</th><th>Cliente</th><th>Productos</th><th>Entrega</th><th>Pago</th><th class="r">Total</th><th>Estado</th><th></th></tr></thead><tbody>
  ${rows.map(o=>`<tr><td class="num muted">${o.n}</td><td><b>${esc(o.customer)}</b><div class="small muted">${esc(o.phone)}</div></td>
    <td class="small">${o.lines.map(l=>l.qty+' × '+esc(byId(S.presentations,l.pres)?.name||'')).join('<br>')}</td>
    <td class="small">${o.delivery==='domicilio'?'Domicilio<div class="muted">'+esc(o.address)+'</div>':'Recoge en cocina'}<div class="muted">Se produce: ${dateLabel(o.prod)}</div></td>
    <td><span class="chip ${o.pay==='efectivo'?'banana':'lilac'}">${o.pay==='efectivo'?'Efectivo':'Transferencia'}</span></td>
    <td class="r num"><b>${money(orderTotal(o))}</b>${o.fee?`<div class="small muted">incluye ${money(o.fee)} domicilio</div>`:''}</td>
    <td>${statusChip(o)}</td>
    <td>${orderActions(o)}</td></tr>`).join('')}
  </tbody></table></div>`:`<div class="empty">No hay pedidos en esta lista.</div>`}`;
},

produccion(){
  const day=UI.tab.produccion||TODAY;
  const days=[TODAY,addDays(TODAY,1)];
  const orders=S.orders.filter(o=>o.prod===day && o.status!=='cancelado');
  const pend=orders.filter(o=>!o.produced);
  const p=plan(pend.flatMap(o=>o.lines));
  const seen=S.seenProd[day]||{};
  const boxes=Object.entries(p.boxes);
  return `<div class="head"><div><h1>Producción del día</h1><p class="muted">Calculada con los pedidos tomados hasta la hora de corte. Primero se usa la masa de los lotes y lo que falta se hace con insumos.</p></div>
    ${pend.length?`<button class="btn yellow" data-act="prod-done" data-day="${day}">Registrar producción terminada</button>`:''}</div>
  <div class="tabs">${days.map(d=>`<button data-act="tab" data-tab="produccion" data-v="${d}" class="${d===day?'on':''}">${dateLabel(d)} · ${longDate(d)}</button>`).join('')}</div>
  ${!pend.length?`<div class="empty">${orders.length?'La producción de este día ya está registrada. Los pedidos están listos para enviar.':'Todavía no hay pedidos para este día.'}</div>`:`
  <div class="grid g4">${kpi(pend.length,'Pedidos','por producir','c-yellow')}${kpi(boxes.reduce((a,b)=>a+b[1],0),'Cajas','por armar','c-lilac')}${kpi(Object.values(p.units).reduce((a,b)=>a+b,0),'Unidades','galletas, rollos y panes','c-strawberry')}${kpi(grams(p.doughRows.reduce((a,d)=>a+d.toMake,0)),'Masa por hacer','sin contar lotes','c-peach')}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Masa</h2><div class="list">${p.doughRows.map(d=>`<div class="it"><div><b>${esc(d.recipe.name)}</b><div class="small muted">Necesitas ${grams(d.need)}${d.fromLots?' · '+grams(d.fromLots)+' del lote':''}</div></div>
      <div style="text-align:right">${d.toMake>0?`<span class="chip warn">Hacer ${grams(d.toMake)}</span><div class="small muted num">${fmtN(d.batches,2)} tandas</div>`:'<span class="chip ok">Alcanza el lote</span>'}</div></div>`).join('')}</div></div>
    <div class="card"><h2>Lista para armar</h2><div>${boxes.map(([id,n])=>{const pr=byId(S.presentations,id);const k='b-'+id;return `<label class="check ${seen[k]?'done':''}"><input type="checkbox" data-act="prod-check" data-day="${day}" data-k="${k}" ${seen[k]?'checked':''}><span><b class="num">${n} ×</b> ${esc(pr.name)}</span></label>`;}).join('')}</div></div>
    <div class="card"><h2>Unidades a hornear</h2><div class="list">${Object.entries(p.units).map(([id,n])=>{const pr=byId(S.products,id);return `<div class="it"><div class="row"><span class="cookie ${pr.look}" style="--s:34px"></span><b>${esc(pr.name)}</b></div><span class="num"><b>${n}</b> und · ${grams(n*pr.grams)}</span></div>`;}).join('')}</div></div>
    <div class="card"><h2>Insumos que se usan</h2>
      ${p.shortages.length?`<div class="callout c-strawberry" style="margin-bottom:10px"><b>No alcanza:</b> ${p.shortages.map(x=>esc(x.s.name)).join(', ')}. Registra una compra antes de producir.</div>`:`<div class="callout c-sky" style="margin-bottom:10px">Hay insumos suficientes para toda la producción.</div>`}
      <div class="list">${p.supplies.sort((a,b)=>b.short-a.short).map(x=>`<div class="it"><span>${esc(x.s.name)}</span><span class="num small">${qty(x.need,x.s.kind)} de ${qty(x.s.stock,x.s.kind)} ${x.short>0?'<span class="chip bad">falta '+qty(x.short,x.s.kind)+'</span>':''}</span></div>`).join('')}</div></div>
  </div>`}`;
},

proveedores(){
  const q=(UI.q.prov||'').toLowerCase();
  const list=S.suppliers.filter(p=>!q||(p.name+' '+p.contact+' '+suppliesOf(p.id).map(s=>s.name).join(' ')).toLowerCase().includes(q));
  return `<div class="head"><div><h1>Proveedores</h1><p class="muted">A quién le compras cada insumo y cómo contactarlo.</p></div><button class="btn yellow" data-act="sup-new">${icon('plus')}Nuevo proveedor</button></div>
  <div class="row" style="margin-bottom:16px"><input class="search" id="q-prov" placeholder="Buscar por nombre, contacto o insumo" value="${esc(UI.q.prov||'')}" data-q="prov"></div>
  ${list.length?`<div class="grid g3">${list.map(p=>{
    const items=suppliesOf(p.id); const buys=S.purchases.filter(c=>c.sup===p.id);
    const spent=buys.reduce((a,c)=>a+c.lines.reduce((x,l)=>x+l.total,0),0);
    const last=buys.map(c=>c.date).sort().pop();
    return `<article class="card c-${p.color} stack" style="gap:12px">
      <div class="row between" style="flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap;min-width:0"><div class="avatar" style="background:var(--surface)">${esc(initials(p.name))}</div><div style="min-width:0"><h3 style="margin:0">${esc(p.name)}</h3><div class="small">${esc(p.contact||'Sin contacto')}</div></div></div>
      <div class="row" style="flex-wrap:nowrap;gap:0"><button class="iconbtn" title="Editar" aria-label="Editar ${esc(p.name)}" data-act="sup-edit" data-id="${p.id}">${icon('edit')}</button><button class="iconbtn" title="Eliminar" aria-label="Eliminar ${esc(p.name)}" data-act="sup-del" data-id="${p.id}">${icon('trash')}</button></div></div>
      <div class="stack small" style="gap:6px">
        ${p.phone?`<div class="row" style="gap:6px">${icon('phone','style="width:16px;height:16px"')}<span class="num" style="user-select:all">${esc(p.phone)}</span><button class="iconbtn" aria-label="Copiar teléfono" data-act="copy" data-v="${esc(p.phone)}">${icon('copy','style="width:14px;height:14px"')}</button></div>`:''}
        ${p.email?`<div class="row" style="gap:6px;flex-wrap:nowrap">${icon('mail','style="width:16px;height:16px;flex:none"')}<span style="user-select:all;overflow-wrap:anywhere">${esc(p.email)}</span></div>`:''}
        ${p.address?`<div class="row" style="gap:6px;flex-wrap:nowrap">${icon('pin','style="width:16px;height:16px;flex:none"')}<span>${esc(p.address)}</span></div>`:''}
      </div>
      <div class="row" style="gap:6px">${items.length?items.map(s=>`<span class="chip" style="background:var(--surface)">${esc(s.name)}</span>`).join(''):'<span class="small muted">Aún no tiene insumos asociados</span>'}</div>
      ${p.notes?`<p class="small" style="opacity:.85">${esc(p.notes)}</p>`:''}
      <div class="row between small" style="border-top:1px dashed rgba(61,36,23,.2);padding-top:10px"><span>${last?'Última compra: '+dateLabel(last):'Sin compras'}</span><b class="num">${money(spent)}</b></div>
    </article>`;}).join('')}</div>`:`<div class="empty">No hay proveedores con esa búsqueda.</div>`}`;
},

insumos(){
  const tab=UI.tab.insumos||'todos', q=(UI.q.ins||'').toLowerCase();
  const list=S.supplies.filter(s=>(tab==='todos'||(tab==='bajos'?s.stock<s.min:s.cat===tab)) && (!q||s.name.toLowerCase().includes(q)));
  const value=S.supplies.reduce((a,s)=>a+s.stock*s.cost,0);
  return `<div class="head"><div><h1>Insumos</h1><p class="muted">Todo se mide por peso, volumen o unidad. El costo es el promedio de lo que has pagado a todos los proveedores.</p></div><button class="btn yellow" data-act="supply-new">${icon('plus')}Nuevo insumo</button></div>
  <div class="grid g4" style="margin-bottom:16px">${kpi(S.supplies.length,'Insumos registrados','','c-banana')}${kpi(money(value),'Valor del inventario','a costo promedio','c-sky')}${kpi(S.supplies.filter(s=>s.stock<s.min).length,'Por debajo del mínimo','','c-strawberry')}</div>
  <div class="row between" style="margin-bottom:12px"><div class="tabs" style="margin:0">${[['todos','Todos'],['ing','Ingredientes'],['emp','Empaques'],['bajos','Bajos']].map(([k,t])=>`<button data-act="tab" data-tab="insumos" data-v="${k}" class="${tab===k?'on':''}">${t}</button>`).join('')}</div>
  <input class="search" id="q-ins" placeholder="Buscar insumo" value="${esc(UI.q.ins||'')}" data-q="ins"></div>
  ${list.length?`<div class="tbl"><table><thead><tr><th>Insumo</th><th>Proveedor</th><th>Existencia</th><th class="r">Costo promedio</th><th class="r">Valor</th><th>Estado</th></tr></thead><tbody>
  ${list.map(s=>{const r=s.stock/s.min, k=r<1?'bad':r<1.3?'warn':'';return `<tr class="click" data-act="supply-edit" data-id="${s.id}"><td><b>${esc(s.name)}</b><div class="small muted">${s.cat==='emp'?'Empaque':'Ingrediente'} · mínimo ${qty(s.min,s.kind)}</div></td>
  <td class="small">${esc(byId(S.suppliers,s.sup)?.name||'—')}</td>
  <td><div class="num" style="font-weight:700">${qty(s.stock,s.kind)}</div><div class="bar ${k}" style="margin-top:4px"><span style="width:${Math.min(100,r/3*100)}%"></span></div></td>
  <td class="r num">${costLabel(s)}</td><td class="r num">${money(s.stock*s.cost)}</td>
  <td>${r<1?'<span class="chip bad">Comprar ya</span>':r<1.3?'<span class="chip warn">Casi en el mínimo</span>':'<span class="chip ok">Bien</span>'}</td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty">No hay insumos en esta lista.</div>`}`;
},

compras(){
  const list=[...S.purchases].sort((a,b)=>b.date.localeCompare(a.date));
  const month=S.purchases.filter(c=>c.date.slice(0,7)===TODAY.slice(0,7)).reduce((a,c)=>a+c.lines.reduce((x,l)=>x+l.total,0),0);
  return `<div class="head"><div><h1>Compras</h1><p class="muted">Al registrar una compra sube la existencia del insumo y se actualiza su costo promedio.</p></div><button class="btn yellow" data-act="purchase-new">${icon('plus')}Registrar compra</button></div>
  <div class="grid g4" style="margin-bottom:16px">${kpi(money(month),'Compras del mes','','c-peach')}${kpi(list.length,'Compras registradas','','c-lilac')}</div>
  ${list.length?`<div class="stack">${list.map(c=>{const p=byId(S.suppliers,c.sup);return `<div class="card"><div class="row between"><div class="row"><div class="avatar" style="background:var(--${p?.color||'banana'})">${esc(initials(p?.name||'?'))}</div><div><b>${esc(p?.name||'Proveedor eliminado')}</b><div class="small muted">${dateLabel(c.date)} · ${longDate(c.date)}</div></div></div><b class="num">${money(c.lines.reduce((a,l)=>a+l.total,0))}</b></div>
  <div class="row" style="margin-top:12px;gap:6px">${c.lines.map(l=>{const s=sup(l.supply);return `<span class="chip banana">${esc(s?.name||'')} · ${qty(l.qty,s?.kind)} · ${money(l.total)}</span>`;}).join('')}</div></div>`;}).join('')}</div>`:`<div class="empty">Aún no hay compras.</div>`}`;
},

recetas(){
  return `<div class="head"><div><h1>Recetas y masas</h1><p class="muted">Cada receta rinde una tanda de masa en gramos. Las galletas se hacen por lote y se guardan; los rollos y panes se hacen solo con pedido.</p></div>
  <div class="row"><button class="btn soft" data-act="lot-new">Producir lote de masa</button><button class="btn yellow" data-act="recipe-new">${icon('plus')}Nueva receta</button></div></div>
  <h2 style="margin-bottom:12px">Masa guardada</h2>
  ${S.lots.filter(l=>l.left>0).length?`<div class="grid g3" style="margin-bottom:26px">${S.lots.filter(l=>l.left>0).map(l=>{const r=byId(S.recipes,l.recipe);const exp=l.expires<=addDays(TODAY,1);return `<div class="card"><div class="row between"><b>${esc(r?.name||'')}</b>${exp?'<span class="chip warn">Usar pronto</span>':'<span class="chip ok">Fresca</span>'}</div>
  <div class="kpi" style="margin-top:10px"><span class="v">${grams(l.left)}</span><span class="s">de ${grams(l.grams)} · hecha ${dateLabel(l.date).toLowerCase()} · vence ${dateLabel(l.expires).toLowerCase()}</span></div>
  <div class="bar" style="margin-top:10px"><span style="width:${l.left/l.grams*100}%"></span></div></div>`;}).join('')}</div>`:`<div class="empty" style="margin-bottom:26px">No hay masa guardada.</div>`}
  <h2 style="margin-bottom:12px">Recetas</h2>
  <div class="grid g3">${S.recipes.map(r=>{const cpg=recipeCostPerG(r);const lot=S.products.some(p=>p.recipe===r.id&&p.mode==='lote');return `<article class="card c-${r.color}">
    <div class="row between"><h3 style="margin:0">${esc(r.name)}</h3><button class="iconbtn" aria-label="Editar receta" data-act="recipe-edit" data-id="${r.id}">${icon('edit')}</button></div>
    <div class="row" style="margin:10px 0 12px;gap:6px"><span class="chip" style="background:var(--surface)">Rinde ${grams(r.yield)}</span><span class="chip" style="background:var(--surface)">${money(cpg*1000)} / kg</span><span class="chip dark">${lot?'Por lote':'Sobre pedido'}</span></div>
    <div class="list small">${r.items.map(i=>{const s=sup(i.supply);return `<div class="it" style="padding:6px 0;border-color:rgba(61,36,23,.15)"><span>${esc(s?.name||'')}</span><span class="num">${qty(i.qty,s?.kind)}</span></div>`;}).join('')}</div>
    ${lot?`<button class="btn sm" style="margin-top:12px" data-act="lot-new" data-id="${r.id}">Producir lote</button>`:''}
  </article>`;}).join('')}</div>`;
},

productos(){
  return `<div class="head"><div><h1>Productos y cajas</h1><p class="muted">El producto dice cuántos gramos de masa lleva cada unidad. La caja es lo que se vende y descuenta su empaque.</p></div>
  <div class="row"><button class="btn soft" data-act="product-new">Nuevo producto</button><button class="btn yellow" data-act="pres-new">${icon('plus')}Nueva caja o presentación</button></div></div>
  <div class="grid g4" style="margin-bottom:26px">${S.products.map(p=>{const r=byId(S.recipes,p.recipe);return `<div class="card"><div class="row" style="flex-wrap:nowrap"><span class="cookie ${p.look}"></span><div style="min-width:0"><b>${esc(p.name)}</b><div class="small muted">${grams(p.grams)} de ${esc(r?.name.replace('Masa de ','masa de ')||'')}</div></div></div>
  <div class="row between" style="margin-top:12px"><span class="chip ${p.mode==='lote'?'banana':'lilac'}">${p.mode==='lote'?'Con lote de masa':'Solo sobre pedido'}</span><span class="small num">Costo ${money(productCost(p))}</span></div></div>`;}).join('')}</div>
  <h2 style="margin-bottom:12px">Lo que se vende</h2>
  <div class="tbl"><table><thead><tr><th>Presentación</th><th>Contenido</th><th class="r">Precio</th><th class="r">Costo</th><th class="r">Margen</th><th>Estado</th></tr></thead><tbody>
  ${S.presentations.map(pr=>{const c=presCost(pr),h=presHealth(pr);return `<tr class="click" data-act="pres-edit" data-id="${pr.id}"><td><b>${esc(pr.name)}</b>${pr.active?'':'<div class="small muted">Pausada</div>'}</td>
  <td class="small">${pr.items.map(i=>i.units+' '+esc(byId(S.products,i.product)?.name.toLowerCase()||'')).join(' + ')}<div class="muted">${pr.pack.map(k=>k.qty+' '+esc(sup(k.supply)?.name.toLowerCase()||'')).join(', ')}</div></td>
  <td class="r num"><b>${money(pr.price)}</b></td><td class="r num">${money(c)}</td><td class="r num">${fmtN(presMargin(pr)*100)} %</td>
  <td><span class="chip ${h.k}">${h.t}</span>${h.sug?`<div class="small muted" style="margin-top:4px">Sugerido ${money(h.sug)}</div>`:''}</td></tr>`;}).join('')}
  </tbody></table></div>`;
},

ediciones(){
  return `<div class="head"><div><h1>Ediciones especiales</h1><p class="muted">Productos de temporada que se venden hasta una fecha o hasta completar un cupo.</p></div><button class="btn yellow" data-act="edition-new">${icon('plus')}Nueva edición</button></div>
  <div class="grid g2">${S.editions.map(e=>{const sold=editionSold(e);const st=e.end<TODAY||(e.cap&&sold>=e.cap)?['bad','Cerrada']:e.start>TODAY?['lilac','Próxima']:['ok','Activa'];
  return `<article class="card c-${e.color}"><div class="row between" style="flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap"><span class="cookie ${e.look}" style="--s:64px"></span><div><span class="chip ${st[0]}">${st[1]}</span><h2 style="margin:6px 0 0">${esc(e.name)}</h2></div></div>
  <button class="iconbtn" aria-label="Eliminar edición" data-act="edition-del" data-id="${e.id}">${icon('trash')}</button></div>
  <p style="margin:12px 0">${esc(e.desc)}</p>
  <div class="row small" style="gap:6px">${e.pres.map(id=>`<span class="chip" style="background:var(--surface)">${esc(byId(S.presentations,id)?.name||'')}</span>`).join('')}</div>
  <div class="grid g4" style="margin-top:14px;gap:10px"><div class="kpi"><span class="l">Vendidas</span><span class="v" style="font-size:24px">${sold}${e.cap?' / '+e.cap:''}</span></div><div class="kpi"><span class="l">Desde</span><span class="v" style="font-size:18px">${dateLabel(e.start)}</span></div><div class="kpi"><span class="l">Hasta</span><span class="v" style="font-size:18px">${dateLabel(e.end)}</span></div></div>
  ${e.cap?`<div class="bar" style="margin-top:12px;height:10px;background:rgba(255,255,255,.55)"><span style="width:${Math.min(100,sold/e.cap*100)}%"></span></div>`:''}
  </article>`;}).join('')}</div>`;
},

analitica(){
  const units={...S.history.units};
  for(const o of S.orders) if(o.status!=='cancelado') for(const l of o.lines) units[l.pres]=(units[l.pres]||0)+l.qty;
  const ranked=S.presentations.map(p=>({p,n:units[p.id]||0})).sort((a,b)=>b.n-a.n);
  const max=Math.max(1,...ranked.map(r=>r.n));
  const weeks=[...S.history.weeks]; weeks[weeks.length-1]+=S.orders.filter(o=>o.date>=addDays(TODAY,-6)&&o.status!=='cancelado').reduce((a,o)=>a+orderSubtotal(o),0);
  const month=weeks.slice(-4).reduce((a,b)=>a+b,0);
  const nOrders=Math.round(month/31000);
  const flagged=S.presentations.map(p=>({p,h:presHealth(p),c:presCost(p)})).filter(x=>x.h.k!=='ok');
  return `<div class="head"><div><h1>Analítica</h1><p class="muted">Qué se vende más, qué se vende poco y qué productos no dejan ganancia.</p></div><span class="pill">Últimas 8 semanas</span></div>
  <div class="grid g4">${kpi(money(month),'Ventas de las últimas 4 semanas','+12 % frente a las 4 anteriores','c-yellow')}${kpi(nOrders,'Pedidos','en 4 semanas','c-lilac')}${kpi(money(month/nOrders),'Ticket promedio','sin domicilio','c-strawberry')}${kpi(flagged.length,'Con margen bajo o pérdida','revisa el precio','c-peach')}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Ventas por semana</h2>${weekChart(weeks)}</div>
    <div class="card"><h2>Los más vendidos</h2><div class="hbars">${ranked.slice(0,5).map(r=>`<div class="hbar"><span class="t">${esc(r.p.name)}</span><span class="n">${r.n}</span><div class="bar"><span style="width:${r.n/max*100}%"></span></div></div>`).join('')}</div></div>
    <div class="card"><h2>Productos que no dejan ganancia</h2>${flagged.length?`<div class="list">${flagged.map(x=>`<div class="it"><div><b>${esc(x.p.name)}</b><div class="small muted">Precio ${money(x.p.price)} · cuesta ${money(x.c)}</div></div><div style="text-align:right"><span class="chip ${x.h.k}">${x.h.t}</span><div class="small" style="margin-top:4px">Sube a <b>${money(x.h.sug)}</b></div></div></div>`).join('')}</div>`:'<div class="empty">Todos los productos tienen buen margen.</div>'}
      <p class="small muted" style="margin-top:10px">El precio sugerido busca un margen del ${S.settings.margin} %, que puedes cambiar en Configuración.</p></div>
    <div class="card"><h2>Los que menos se venden</h2><div class="hbars">${ranked.slice(-4).reverse().map(r=>`<div class="hbar"><span class="t">${esc(r.p.name)}</span><span class="n">${r.n}</span><div class="bar warn"><span style="width:${r.n/max*100}%"></span></div></div>`).join('')}</div></div>
  </div>`;
},

function suppliesOf(id){ return S.supplies.filter(s=>s.sup===id); }
function editionSold(e){ return e.sold + S.orders.filter(o=>o.status!=='cancelado'&&o.date>=e.start&&o.date<=e.end).reduce((a,o)=>a+o.lines.filter(l=>e.pres.includes(l.pres)).reduce((x,l)=>x+l.qty,0),0); }
function statusChip(o){
  if(o.status==='cancelado') return '<span class="chip bad">Cancelado</span>';
  if(o.status==='entregado') return '<span class="chip ok">Entregado</span>';
  if(o.status==='camino') return `<span class="chip lilac">En camino</span><div class="small muted">${esc(byId(S.settings.couriers,o.courier)?.name||'')}</div>`;
  return o.produced?'<span class="chip banana">Listo para enviar</span>':'<span class="chip warn">Por producir</span>';
}
function orderActions(o){
  if(o.status==='pendiente' && o.produced) return `<button class="btn sm" data-act="order-send" data-id="${o.id}">Enviar</button>`;
  if(o.status==='pendiente') return `<button class="btn ghost sm" data-act="order-cancel" data-id="${o.id}">Cancelar</button>`;
  if(o.status==='camino') return `<button class="btn soft sm" data-act="order-deliver" data-id="${o.id}">Entregado</button>`;
  return '';
}
function weekChart(weeks){
  const W=560,H=230,pl=56,pb=28,pt=24,max=Math.ceil(Math.max(...weeks)/250000)*250000;
  const bw=(W-pl-10)/weeks.length;
  const y=v=>H-pb-(v/max)*(H-pb-pt);
  const ticks=[0,max/2,max];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por semana">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t>=1e6?fmtN(t/1e6,1)+' M':fmtN(t/1000)+' mil'}</text>`).join('')}
    ${weeks.map((v,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64,last=i===weeks.length-1;return `<rect x="${x}" y="${y(v)}" width="${w}" height="${H-pb-y(v)}" rx="8" fill="${last?'var(--yellow-deep)':'var(--peach)'}"/>${last?`<text class="lbl" x="${x+w/2}" y="${y(v)-7}" text-anchor="middle">${fmtN(v/1000)} mil</text>`:''}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${i===weeks.length-1?'Esta':'S'+(i+1)}</text>`;}).join('')}
  </svg></div>`;
}

/* ================= Modales ================= */
let MODAL=null;
function openModal({title,sub='',body,submit='Guardar',onSubmit,onInput,danger=false,wide=false}){
  MODAL={onSubmit,onInput};
  $('#modal-root').innerHTML=`<div class="veil" data-act="veil"><form class="modal" data-form="modal" ${wide?'style="width:min(760px,100%)"':''} novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><div><h2>${esc(title)}</h2>${sub?`<p class="muted small" style="margin-top:6px">${sub}</p>`:''}</div><button type="button" class="iconbtn" data-act="close" aria-label="Cerrar">${icon('x')}</button></header>
    <div class="body">${body}<div class="err" id="m-err" hidden></div></div>
    <footer><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn ${danger?'danger':'yellow'}">${submit}</button></footer></form></div>`;
  const f=$('#modal-root form'); onInput?.(f);
  setTimeout(()=>f.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea')?.focus(),30);
}
function closeModal(){ $('#modal-root').innerHTML=''; MODAL=null; }
function mErr(msg){ const e=$('#m-err'); if(!e) return; e.textContent=msg; e.hidden=!msg; }

const opt = (list,sel,label=x=>x.name) => list.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(label(x))}</option>`).join('');
const supOpts = sel => `<option value="">Elige un insumo</option>`+opt([...S.supplies].sort((a,b)=>a.name.localeCompare(b.name)),sel,s=>s.name+' ('+unitOf(s.kind)+')');
const LINE = {
  recipe:(v={})=>`<div class="line k-recipe"><select data-f="supply" aria-label="Insumo">${supOpts(v.supply)}</select><input data-f="qty" type="number" min="0" step="any" placeholder="Cantidad" value="${v.qty??''}" aria-label="Cantidad"><button type="button" class="iconbtn" data-act="rmline" aria-label="Quitar">${icon('x')}</button></div>`,
  pack:(v={})=>LINE.recipe(v).replace('k-recipe','k-pack'),
  items:(v={})=>`<div class="line k-items"><select data-f="product" aria-label="Producto"><option value="">Elige un producto</option>${opt(S.products,v.product)}</select><input data-f="units" type="number" min="1" step="1" placeholder="Unidades" value="${v.units??''}" aria-label="Unidades"><button type="button" class="iconbtn" data-act="rmline" aria-label="Quitar">${icon('x')}</button></div>`,
  order:(v={})=>`<div class="line k-order"><select data-f="pres" aria-label="Presentación"><option value="">Elige qué pidió</option>${opt(S.presentations.filter(p=>p.active),v.pres,p=>p.name+' · '+money(p.price))}</select><input data-f="qty" type="number" min="1" step="1" value="${v.qty??1}" aria-label="Cantidad"><button type="button" class="iconbtn" data-act="rmline" aria-label="Quitar">${icon('x')}</button></div>`,
  purchase:(v={})=>`<div class="line k-purchase"><select data-f="supply" aria-label="Insumo">${supOpts(v.supply)}</select><input data-f="qty" type="number" min="0" step="any" placeholder="Cantidad" aria-label="Cantidad" value="${v.qty??''}"><select data-f="unit" aria-label="Unidad"><option>kg</option><option>g</option><option>l</option><option>ml</option><option>und</option></select><input data-f="total" type="number" min="0" step="100" placeholder="Total $" aria-label="Total pagado"><button type="button" class="iconbtn" data-act="rmline" aria-label="Quitar">${icon('x')}</button></div>`
};
function linesBlock(kind,values,addLabel){ return `<div class="lines" data-kind="${kind}">${(values.length?values:[{}]).map(v=>LINE[kind](v)).join('')}</div><div><button type="button" class="btn soft sm" data-act="addline" data-kind="${kind}">${icon('plus')}${addLabel}</button></div>`; }
function readLines(form,kind){ return $$(`.lines[data-kind="${kind}"] .line`,form).map(r=>Object.fromEntries($$('[data-f]',r).map(i=>[i.dataset.f,i.type==='number'?(i.value===''?NaN:Number(i.value)):i.value]))); }
const val = (f,n) => f.elements[n]?.value?.trim?.() ?? '';
const COLORS=['banana','strawberry','lilac','peach','sky'];
const colorSeg=(name,sel)=>`<div class="seg">${COLORS.map(c=>`<label><input type="radio" name="${name}" value="${c}" ${c===sel?'checked':''}><span style="background:var(--${c});border-color:transparent">${{banana:'Vainilla',strawberry:'Fresa',lilac:'Lavanda',peach:'Durazno',sky:'Cielo'}[c]}</span></label>`).join('')}</div>`;

    body:`<div class="fields">
      <label class="f">Nombre del proveedor<input id="sp-name" name="name" required value="${esc(p.name||'')}" placeholder="Ej. Harinas El Trigal"></label>
      <label class="f">Persona de contacto<input id="sp-contact" name="contact" value="${esc(p.contact||'')}" placeholder="Ej. Marta López"></label>
      <label class="f">Teléfono o WhatsApp<input id="sp-phone" name="phone" inputmode="tel" value="${esc(p.phone||'')}" placeholder="300 000 0000"></label>
      <label class="f">Correo<input id="sp-email" name="email" type="email" value="${esc(p.email||'')}" placeholder="ventas@proveedor.co"></label></div>
      <label class="f">Dirección<input id="sp-address" name="address" value="${esc(p.address||'')}"></label>
      <div><div class="eyebrow" style="margin-bottom:6px">Qué le compras</div><div class="seg">${S.supplies.map(s=>`<label><input type="checkbox" name="sells" value="${s.id}" ${linked.has(s.id)?'checked':''}><span>${esc(s.name)}</span></label>`).join('')}</div></div>
      <label class="f">Notas<textarea id="sp-notes" name="notes" placeholder="Días de entrega, pedido mínimo, descuentos…">${esc(p.notes||'')}</textarea></label>
      <div><div class="eyebrow" style="margin-bottom:6px">Color de la tarjeta</div>${colorSeg('color',p.color||'banana')}</div>`,
    onSubmit(f){
      const name=val(f,'name'); if(!name) return mErr('Escribe el nombre del proveedor.');
      const data={name,contact:val(f,'contact'),phone:val(f,'phone'),email:val(f,'email'),address:val(f,'address'),notes:val(f,'notes'),color:f.elements.color.value};
      let id=p.id; if(id) Object.assign(byId(S.suppliers,id),data); else { id=uid('p'); S.suppliers.push({id,...data}); }
      const sells=new Set($$('input[name=sells]:checked',f).map(i=>i.value));
      for(const s of S.supplies){ if(sells.has(s.id)) s.sup=id; else if(s.sup===id) s.sup=''; }
      return p.id?'Proveedor actualizado':'Proveedor agregado';
    }});
}

/* --- Insumo --- */
function supplyForm(s={}){
  const kind=s.kind||'mass';
  const per=k=>k==='unit'?'unidad':k==='vol'?'litro':'kilo';
  const disp=(n,k)=>n===undefined?'':k==='unit'?n:n/1000;
  openModal({title:s.id?'Editar insumo':'Nuevo insumo',sub:'La existencia y el mínimo se escriben en kilos, litros o unidades.',
    body:`<label class="f">Nombre<input id="su-name" name="name" required value="${esc(s.name||'')}" placeholder="Ej. Nueces picadas"></label>
    <div><div class="eyebrow" style="margin-bottom:6px">Cómo se mide</div><div class="seg">${[['mass','Por peso'],['vol','Por volumen'],['unit','Por unidad']].map(([k,t])=>`<label><input type="radio" name="kind" value="${k}" ${k===kind?'checked':''}><span>${t}</span></label>`).join('')}</div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Tipo</div><div class="seg">${[['ing','Ingrediente'],['emp','Empaque']].map(([k,t])=>`<label><input type="radio" name="cat" value="${k}" ${k===(s.cat||'ing')?'checked':''}><span>${t}</span></label>`).join('')}</div></div>
    <div class="fields">
      <label class="f">Existencia actual (<span data-u>${{mass:'kg',vol:'l',unit:'und'}[kind]}</span>)<input id="su-stock" name="stock" type="number" min="0" step="any" value="${disp(s.stock,kind)}" required></label>
      <label class="f">Mínimo para alertar (<span data-u>${{mass:'kg',vol:'l',unit:'und'}[kind]}</span>)<input id="su-min" name="min" type="number" min="0" step="any" value="${disp(s.min,kind)}" required></label>
      <label class="f">Costo por <span data-per>${per(kind)}</span> ($)<input id="su-cost" name="cost" type="number" min="0" step="any" value="${s.cost===undefined?'':kind==='unit'?s.cost:Math.round(s.cost*1000)}" required></label>
      <label class="f">Proveedor<select id="su-sup" name="sup"><option value="">Sin proveedor</option>${opt(S.suppliers,s.sup)}</select></label></div>
    ${s.id?`<div><button type="button" class="btn ghost sm" data-act="supply-del" data-id="${s.id}">${icon('trash')}Eliminar insumo</button></div>`:''}`,
    onInput(f){ const k=f.elements.kind.value; $$('[data-u]',f).forEach(e=>e.textContent={mass:'kg',vol:'l',unit:'und'}[k]); $('[data-per]',f).textContent=per(k); },
    onSubmit(f){
      const name=val(f,'name'), k=f.elements.kind.value, m=k==='unit'?1:1000;
      const stock=Number(val(f,'stock')), min=Number(val(f,'min')), cost=Number(val(f,'cost'));
      if(!name) return mErr('Escribe el nombre del insumo.');
      if(val(f,'stock')===''||val(f,'min')===''||val(f,'cost')==='' || stock<0||min<0||cost<0) return mErr('Completa existencia, mínimo y costo con números positivos.');
      const data={name,kind:k,cat:f.elements.cat.value,stock:stock*m,min:min*m,cost:cost/m,sup:val(f,'sup')};
      if(s.id) Object.assign(sup(s.id),data); else S.supplies.push({id:uid('s'),...data});
      return s.id?'Insumo actualizado':'Insumo agregado';
    }});
}

/* --- Compra --- */
const UNIT_F={kg:['mass',1000],g:['mass',1],l:['vol',1000],ml:['vol',1],und:['unit',1]};
function purchaseForm(){
  openModal({title:'Registrar compra',sub:'Escribe lo que compraste y cuánto pagaste por cada insumo.',wide:true,
    body:`<div class="fields"><label class="f">Proveedor<select id="pu-sup" name="sup" required><option value="">Elige un proveedor</option>${opt(S.suppliers)}</select></label><label class="f">Fecha<input id="pu-date" name="date" type="date" value="${TODAY}" max="${TODAY}" required></label></div>
    <div class="eyebrow">Insumos comprados</div>${linesBlock('purchase',[],'Agregar insumo')}
    <div class="callout c-banana row between"><span>Total de la compra</span><b class="num" id="pu-total">$ 0</b></div>`,
    onInput(f){
      const sel=val(f,'sup');
      $$('.line.k-purchase',f).forEach(r=>{ const s=sup(r.querySelector('[data-f=supply]').value), u=r.querySelector('[data-f=unit]');
        if(s && !r.dataset.touched){ u.value={mass:'kg',vol:'l',unit:'und'}[s.kind]; r.dataset.touched=s.id; }
        else if(s && r.dataset.touched!==s.id){ u.value={mass:'kg',vol:'l',unit:'und'}[s.kind]; r.dataset.touched=s.id; } });
      $('#pu-total').textContent=money(readLines(f,'purchase').reduce((a,l)=>a+(l.total||0),0));
    },
    onSubmit(f){
      const supId=val(f,'sup'); if(!supId) return mErr('Elige el proveedor.');
      const lines=readLines(f,'purchase').filter(l=>l.supply);
      if(!lines.length) return mErr('Agrega al menos un insumo.');
      const out=[];
      for(const l of lines){ const s=sup(l.supply), [k,m]=UNIT_F[l.unit];
        if(!(l.qty>0)||!(l.total>=0)||isNaN(l.total)) return mErr('Escribe cantidad y total de '+s.name+'.');
        if(k!==s.kind) return mErr(s.name+' se mide en '+unitOf(s.kind)+'. Cambia la unidad.');
        out.push({supply:s.id,qty:l.qty*m,total:l.total}); }
      for(const l of out){ const s=sup(l.supply); s.cost=(s.stock*s.cost+l.total)/(s.stock+l.qty); s.stock+=l.qty; if(!s.sup) s.sup=supId; }
      S.purchases.push({id:uid('c'),date:val(f,'date')||TODAY,sup:supId,lines:out});
      return 'Compra registrada. Existencias actualizadas';
    }});
}

    onInput(f){ const items=readLines(f,'recipe').filter(i=>i.supply&&i.qty>0), y=Number(val(f,'yield'));
      $('#re-cost').textContent = items.length&&y>0 ? money(recipeCostPerG({items,yield:y})*1000)+' por kg' : '—'; },

/* --- Registrar producción --- */
function registerProduction(day){
  const pend=S.orders.filter(o=>o.prod===day&&o.status==='pendiente'&&!o.produced);
  const p=plan(pend.flatMap(o=>o.lines));
  if(p.shortages.length){ toast('Faltan insumos: '+p.shortages.map(x=>x.s.name).join(', ')); return; }
  for(const d of p.doughRows){
    let take=d.fromLots; for(const l of S.lots.filter(l=>l.recipe===d.recipe.id&&l.left>0).sort((a,b)=>a.expires.localeCompare(b.expires))){ const t=Math.min(l.left,take); l.left-=t; take-=t; if(take<=0) break; }
  }
  for(const x of p.supplies){ x.s.stock = Math.max(0, x.s.stock - (x.s.kind==='unit'?Math.ceil(x.need):x.need)); }
  S.lots=S.lots.filter(l=>l.left>0.5);
  pend.forEach(o=>o.produced=true);
  save(); render(); toast('Producción registrada. '+pend.length+' pedidos listos para enviar');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;

  if(a==='veil'){ if(e.target===t) closeModal(); return; }
  if(t.tagName==='INPUT' && a!=='prod-check') return;
  const done=msg=>{ save(); render(); if(msg) toast(msg); };
  switch(a){
    case 'close': closeModal(); break;
    case 'logout': S.session=false; done(); break;
    case 'tab': UI.tab[t.dataset.tab]=t.dataset.v; render(); break;
    case 'addline': { const box=t.closest('.body').querySelector(`.lines[data-kind="${t.dataset.kind}"]`); box.insertAdjacentHTML('beforeend',LINE[t.dataset.kind]()); box.lastElementChild.querySelector('select')?.focus(); MODAL?.onInput?.(t.closest('form')); break; }
    case 'rmline': { const f=t.closest('form'), r=t.closest('.line'), box=r.parentElement; if(box.children.length>1) r.remove(); else $$('input,select',r).forEach(i=>i.value=i.type==='number'&&box.dataset.kind==='order'?1:''); MODAL?.onInput?.(f); break; }
    case 'copy': navigator.clipboard?.writeText(t.dataset.v).then(()=>toast('Copiado: '+t.dataset.v)).catch(()=>toast('Selecciona el número para copiarlo')); break;
    case 'voice': openModal({title:'¿Cuánto produzco hoy?',sub:'Así responderá el asistente de voz de la cocina.',submit:'Entendido',body:voiceAnswer(),onSubmit:()=>null}); break;
    case 'sup-new': supplierForm(); break;

  const pend=S.orders.filter(o=>o.prod===TODAY&&o.status==='pendiente'&&!o.produced);
  const p=plan(pend.flatMap(o=>o.lines));
  const parts=p.doughRows.map(d=>d.toMake>0?`${grams(d.toMake)} de ${d.recipe.name.toLowerCase()}`:`nada de ${d.recipe.name.toLowerCase()} (alcanza el lote)`);
  return `<div class="row" style="gap:10px;flex-wrap:nowrap"><div class="avatar" style="background:var(--yellow)">${icon('mic','style="width:18px;height:18px"')}</div><div class="card c-banana" style="padding:14px 16px"><p><i>“¿Cuánto tengo que producir hoy?”</i></p></div></div>
  <div class="card" style="padding:16px"><p>${pend.length?`Hoy tienes ${pend.length} pedidos. Debes hacer ${parts.join(', ')}. ${p.shortages.length?'Ojo: falta '+p.shortages.map(x=>x.s.name.toLowerCase()).join(' y ')+'.':'Tienes todos los insumos.'}`:'Hoy no tienes pedidos pendientes por producir.'}</p></div>
  <p class="small muted">En la versión real se activa con la voz, sin tocar la pantalla.</p>`;
}

render();
</script>
</body>
</html>
